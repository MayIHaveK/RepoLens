name: 功能建议
description: 为 RepoLens 提出改进建议
title: "[功能]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能需要改善哪项工作流程或限制？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的实现效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
