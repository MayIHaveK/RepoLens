name: 错误报告
description: 报告 RepoLens 中可复现的异常行为
title: "[错误]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿包含私有源代码、仓库路径、凭据或邮箱地址。
  - type: input
    id: version
    attributes:
      label: RepoLens 版本
      placeholder: 请填写 repolens version 的输出
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明预期行为、实际行为和已脱敏的复现步骤。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: text
