name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run check
      - working-directory: web
        run: npm run build
      - run: go test ./...
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o dist/repolens-windows-amd64.exe ./cmd/repolens
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o dist/repolens-linux-amd64 ./cmd/repolens
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${version}" -o dist/repolens-darwin-arm64 ./cmd/repolens
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "RepoLens $GITHUB_REF_NAME"

